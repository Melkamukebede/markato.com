<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopMart - Forgot Password</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        :root {
            --amazon-dark: #131921;
            --amazon-orange: #febd69;
        }
        
        body {
            background: linear-gradient(135deg, #eaeded 0%, #d5dbdb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        
        .logo-brand {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--amazon-dark);
            text-decoration: none;
            text-align: center;
            display: block;
            margin-bottom: 20px;
        }
        
        .logo-brand .dot { color: var(--amazon-orange); }
        
        .btn-reset {
            background: var(--amazon-orange);
            border: none;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
        }
        
        .btn-reset:hover { background: #f3a847; }
        
        .alert { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <a href="../index.html" class="logo-brand">shop<span class="dot">.</span>mart</a>
        
        <h4><i class="bi bi-key me-2"></i> Password assistance</h4>
        <p class="text-muted">Enter the email address associated with your account.</p>
        
        <div class="alert alert-danger" id="errorAlert"></div>
        <div class="alert alert-success" id="successAlert"></div>
        
        <form id="resetForm" onsubmit="return false;">
            <div class="mb-3">
                <label class="form-label fw-bold">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="Enter email" required>
            </div>
            
            <button type="submit" class="btn btn-reset mb-3" id="resetBtn">
                <i class="bi bi-envelope me-2"></i> Send reset link
            </button>
        </form>
        
        <div class="text-center">
            <a href="login.html" style="color:#0066c0;text-decoration:none;">
                <i class="bi bi-arrow-left me-1"></i> Back to Sign In
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    
    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const errorAlert = document.getElementById('errorAlert');
            const successAlert = document.getElementById('successAlert');
            const resetBtn = document.getElementById('resetBtn');
            
            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';
            
            if (!email) {
                errorAlert.textContent = 'Please enter your email address';
                errorAlert.style.display = 'block';
                return;
            }
            
            resetBtn.disabled = true;
            resetBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending...';
            
            const result = await authSystem.forgotPassword(email);
            
            if (result.success) {
                successAlert.textContent = result.message;
                successAlert.style.display = 'block';
            } else {
                errorAlert.textContent = result.message;
                errorAlert.style.display = 'block';
            }
            
            resetBtn.disabled = false;
            resetBtn.innerHTML = '<i class="bi bi-envelope me-2"></i> Send reset link';
        });
    </script>
</body>
</html>
