<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopMart - Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --amazon-dark:#131921; --amazon-mid:#232f3e; --amazon-orange:#febd69; --amazon-link:#007185; }
        body { background: #f3f3f3; font-family: Arial, sans-serif; }
        .header-top { background: var(--amazon-dark); padding: 10px 0; text-align: center; }
        .logo-brand { color: #fff; font-size: 1.6rem; font-weight: 800; text-decoration: none; letter-spacing: -1px; }
        .logo-brand .dot { color: var(--amazon-orange); }
        .auth-card {
            background: #fff; border: 1px solid #ddd; border-radius: 8px;
            padding: 28px 28px 22px; width: 100%; max-width: 380px; margin: 28px auto;
        }
        .auth-card h4 { font-size: 1.2rem; font-weight: 700; margin-bottom: 18px; }
        .form-label { font-size: 0.85rem; font-weight: 600; }
        .form-control { font-size: 0.9rem; border-radius: 6px; }
        .form-control:focus { box-shadow: 0 0 0 3px rgba(255,153,0,.3); border-color: #e77600; }
        .form-hint { font-size: 0.75rem; color: #777; margin-top: 3px; }
        .btn-create {
            background: linear-gradient(to bottom, #f7dfa5, #f0c14b);
            border: 1px solid #a88734;
            color: #111; font-weight: 600; border-radius: 6px; padding: 8px;
            width: 100%; cursor: pointer; font-size: 0.95rem;
        }
        .btn-create:hover { background: linear-gradient(to bottom, #f5d78e, #eeb933); }
        .terms-text { font-size: 0.75rem; color: #555; margin: 14px 0; line-height: 1.5; }
        .terms-text a { color: var(--amazon-link); text-decoration: none; }
        .terms-text a:hover { text-decoration: underline; }
        .auth-footer { border-top: 1px solid #eee; margin-top: 18px; padding-top: 14px; text-align: center; font-size: 0.82rem; color: #555; }
        .auth-footer a { color: var(--amazon-link); text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }
        .page-footer { text-align: center; font-size: 0.75rem; color: #888; padding: 20px; }
        .page-footer a { color: #555; text-decoration: none; margin: 0 8px; }
        .page-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<header class="header-top">
    <a href="../index.html" class="logo-brand">merkato<span class="dot">.</span>com</a>
</header>

<div class="auth-card">
    <h4>Create account</h4>

    <!-- Error placeholder -->
    <div id="signupError"></div>

    <form id="signupForm" novalidate>
        <div class="mb-3">
            <label class="form-label" for="signupName">Your name</label>
            <input type="text" class="form-control" id="signupName" placeholder="First and last name" autocomplete="name" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="signupEmail">Email</label>
            <input type="email" class="form-control" id="signupEmail" autocomplete="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="signupPhone">Mobile phone number <span class="text-muted fw-normal">(optional)</span></label>
            <input type="tel" class="form-control" id="signupPhone" placeholder="+251 91 234 5678" autocomplete="tel">
            <div class="form-hint">May be used for account security</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="signupPassword">Password</label>
            <input type="password" class="form-control" id="signupPassword" autocomplete="new-password" required>
            <div class="form-hint">Passwords must be at least 6 characters.</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="signupPassword2">Re-enter password</label>
            <input type="password" class="form-control" id="signupPassword2" autocomplete="new-password" required>
        </div>

        <div class="terms-text">
            By creating an account, you agree to Merkato's
            <a href="#">Conditions of Use</a> and <a href="#">Privacy Notice</a>.
        </div>

        <button type="submit" class="btn-create">Create your Merkato account</button>
    </form>

    <div class="auth-footer">
        Already have an account?<br>
        <a href="login.html">Sign in</a>
    </div>
</div>

<div class="page-footer">
    <a href="#">Conditions of Use</a>
    <a href="#">Privacy Notice</a>
    <a href="#">Help</a>
    <p class="mt-2 mb-0">© 2024 ShopMart. All rights reserved.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/auth.js"></script>
</body>
</html>
