<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopMart - Sign In</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        :root {
            --amazon-dark: #131921;
            --amazon-orange: #febd69;
            --amazon-yellow: #f3a847;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #eaeded 0%, #d5dbdb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', 'Amazon Ember', Arial, sans-serif;
        }
        
        .login-container {
            width: 100%;
            max-width: 400px;
        }
        
        .login-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 30px 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            border: 1px solid #e0e0e0;
        }
        
        .logo-brand {
            font-size: 2rem;
            font-weight: 800;
            color: var(--amazon-dark);
            text-decoration: none;
            text-align: center;
            display: block;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }
        
        .logo-brand .dot {
            color: var(--amazon-orange);
        }
        
        .login-card h4 {
            font-weight: 600;
            margin-bottom: 20px;
            color: #0f1111;
        }
        
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #0f1111;
            margin-bottom: 4px;
        }
        
        .form-control {
            border: 1.5px solid #a6a6a6;
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        
        .form-control:focus {
            border-color: var(--amazon-orange);
            box-shadow: 0 0 0 3px rgba(254, 189, 105, 0.3);
            outline: none;
        }
        
        .btn-signin {
            background: var(--amazon-orange);
            border: none;
            font-weight: 600;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            color: #1a1a1a;
            width: 100%;
        }
        
        .btn-signin:hover {
            background: var(--amazon-yellow);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }
        
        /* Social Login Buttons */
        .social-login-section {
            margin-top: 20px;
        }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #767676;
            font-size: 0.8rem;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .divider span {
            padding: 0 15px;
        }
        
        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            border: 1.5px solid #d0d0d0;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            background: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 10px;
            color: #333;
        }
        
        .btn-social:hover {
            background: #f7f7f7;
            border-color: #a0a0a0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .btn-google {
            border-color: #4285f4;
            color: #4285f4;
        }
        .btn-google:hover {
            background: #f8fbff;
            border-color: #3367d6;
        }
        
        .btn-facebook {
            border-color: #1877f2;
            color: #1877f2;
        }
        .btn-facebook:hover {
            background: #f0f6ff;
            border-color: #166fe5;
        }
        
        .btn-github {
            border-color: #333333;
            color: #333333;
        }
        .btn-github:hover {
            background: #f5f5f5;
            border-color: #000000;
        }
        
        .btn-microsoft {
            border-color: #00a4ef;
            color: #00a4ef;
        }
        .btn-microsoft:hover {
            background: #f0f9ff;
            border-color: #0078d4;
        }
        
        .btn-twitter {
            border-color: #1da1f2;
            color: #1da1f2;
        }
        .btn-twitter:hover {
            background: #f0f8ff;
            border-color: #1a91da;
        }
        
        .btn-social i {
            font-size: 1.2rem;
        }
        
        /* User Profile Dropdown (in main page) */
        .user-menu {
            position: relative;
        }
        
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 20px 16px;
            }
            
            .logo-brand {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Logo -->
        <a href="../index.html" class="logo-brand">
            shop<span class="dot">.</span>mart
        </a>
        
        <!-- Login Form -->
        <div class="login-card">
            <h4>Sign in</h4>
            
            <!-- Email/Password Form -->
            <form id="loginForm" onsubmit="return false;">
                <div class="mb-3">
                    <label for="email" class="form-label">Email or mobile phone number</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter email" required>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                </div>
                
                <button type="submit" class="btn btn-signin mb-3" id="signInBtn">
                    Sign in
                </button>
                
                <p class="terms-text mb-3" style="font-size:0.75rem;color:#555;">
                    By continuing, you agree to ShopMart's 
                    <a href="#" style="color:#0066c0;">Conditions of Use</a> and 
                    <a href="#" style="color:#0066c0;">Privacy Notice</a>.
                </p>
            </form>
            
            <!-- Divider -->
            <div class="divider">
                <span>or sign in with</span>
            </div>
            
            <!-- Social Login Buttons -->
            <div class="social-login-section">
                <!-- Google Login -->
                <button class="btn-social btn-google" id="googleLoginBtn">
                    <i class="bi bi-google"></i>
                    Continue with Google
                </button>
                
                <!-- Facebook Login -->
                <button class="btn-social btn-facebook" id="facebookLoginBtn">
                    <i class="bi bi-facebook"></i>
                    Continue with Facebook
                </button>
                
                <!-- GitHub Login -->
                <button class="btn-social btn-github" id="githubLoginBtn">
                    <i class="bi bi-github"></i>
                    Continue with GitHub
                </button>
                
                <!-- Microsoft Login -->
                <button class="btn-social btn-microsoft" id="microsoftLoginBtn">
                    <i class="bi bi-microsoft"></i>
                    Continue with Microsoft
                </button>
                
                <!-- Twitter Login -->
                <button class="btn-social btn-twitter" id="twitterLoginBtn">
                    <i class="bi bi-twitter"></i>
                    Continue with Twitter
                </button>
            </div>
            
            <!-- Create Account -->
            <div class="divider mt-4">
                <span>New to ShopMart?</span>
            </div>
            <button type="button" class="btn btn-outline-secondary w-100 rounded-3" onclick="alert('Create account feature coming soon!')">
                Create your ShopMart account
            </button>
        </div>
        
        <!-- Footer Links -->
        <div class="text-center mt-3" style="font-size:0.8rem;">
            <a href="#" style="color:#0066c0;text-decoration:none;margin:0 10px;">Conditions of Use</a>
            <a href="#" style="color:#0066c0;text-decoration:none;margin:0 10px;">Privacy Notice</a>
            <a href="#" style="color:#0066c0;text-decoration:none;margin:0 10px;">Help</a>
        </div>
        <p class="text-center text-muted mt-2" style="font-size:0.75rem;">
            © 2024 ShopMart. All rights reserved.
        </p>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <!-- Login Logic -->
    <script>
        // ============================================
        // Firebase Configuration
        // REPLACE WITH YOUR OWN FIREBASE CONFIG
        // ============================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        
        // ============================================
        // Social Login Functions
        // ============================================
        
        // Google Login
        document.getElementById('googleLoginBtn').addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            socialLogin(provider);
        });
        
        // Facebook Login
        document.getElementById('facebookLoginBtn').addEventListener('click', () => {
            const provider = new firebase.auth.FacebookAuthProvider();
            socialLogin(provider);
        });
        
        // GitHub Login
        document.getElementById('githubLoginBtn').addEventListener('click', () => {
            const provider = new firebase.auth.GithubAuthProvider();
            socialLogin(provider);
        });
        
        // Microsoft Login
        document.getElementById('microsoftLoginBtn').addEventListener('click', () => {
            const provider = new firebase.auth.OAuthProvider('microsoft.com');
            socialLogin(provider);
        });
        
        // Twitter Login
        document.getElementById('twitterLoginBtn').addEventListener('click', () => {
            const provider = new firebase.auth.TwitterAuthProvider();
            socialLogin(provider);
        });
        
        // Generic Social Login Handler
        function socialLogin(provider) {
            auth.signInWithPopup(provider)
                .then((result) => {
                    // User signed in successfully
                    const user = result.user;
                    console.log('✅ Login successful:', user);
                    
                    // Save user data to localStorage
                    const userData = {
                        uid: user.uid,
                        displayName: user.displayName,
                        email: user.email,
                        photoURL: user.photoURL,
                        provider: result.providerId,
                        lastLogin: new Date().toISOString()
                    };
                    localStorage.setItem('shopmart_user', JSON.stringify(userData));
                    
                    // Redirect to main page
                    alert(`Welcome, ${user.displayName}! 🎉`);
                    window.location.href = '../index.html';
                })
                .catch((error) => {
                    console.error('❌ Login failed:', error);
                    alert(`Login failed: ${error.message}`);
                });
        }
        
        // Email/Password Login (Demo)
        document.getElementById('signInBtn').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (email && password) {
                // Demo: Simple validation
                if (password.length < 6) {
                    alert('Password must be at least 6 characters');
                    return;
                }
                
                // In production, use: auth.signInWithEmailAndPassword(email, password)
                const demoUser = {
                    uid: 'demo_' + Date.now(),
                    displayName: email.split('@')[0],
                    email: email,
                    photoURL: null,
                    provider: 'password',
                    lastLogin: new Date().toISOString()
                };
                localStorage.setItem('shopmart_user', JSON.stringify(demoUser));
                
                alert(`Welcome, ${demoUser.displayName}! 🎉\n(Demo mode - Firebase not configured)`);
                window.location.href = '../index.html';
            }
        });
        
        // Check if already logged in
        window.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('shopmart_user');
            if (user) {
                const userData = JSON.parse(user);
                console.log('👤 User already logged in:', userData.displayName);
            }
        });
    </script>
</body>
</html>
