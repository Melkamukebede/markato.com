<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopMart - Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --amazon-dark:#131921; --amazon-mid:#232f3e; --amazon-orange:#febd69; --amazon-link:#007185; }
        body { background: #f3f3f3; font-family: Arial, sans-serif; }
        .header-top { background: var(--amazon-dark); padding: 10px 0; text-align: center; }
        .logo-brand { color: #fff; font-size: 1.6rem; font-weight: 800; text-decoration: none; letter-spacing: -1px; }
        .logo-brand .dot { color: var(--amazon-orange); }
        .auth-card {
            background: #fff; border: 1px solid #ddd; border-radius: 8px;
            padding: 28px 28px 22px; width: 100%; max-width: 360px; margin: 28px auto;
        }
        .auth-card h4 { font-size: 1.2rem; font-weight: 700; margin-bottom: 18px; }
        .form-label { font-size: 0.85rem; font-weight: 600; }
        .form-control { font-size: 0.9rem; border-radius: 6px; }
        .form-control:focus { box-shadow: 0 0 0 3px rgba(255,153,0,.3); border-color: #e77600; }
        .btn-signin {
            background: linear-gradient(to bottom, #f7dfa5, #f0c14b);
            border: 1px solid #a88734;
            color: #111; font-weight: 600; border-radius: 6px; padding: 8px;
            width: 100%; cursor: pointer; font-size: 0.95rem;
        }
        .btn-signin:hover { background: linear-gradient(to bottom, #f5d78e, #eeb933); }
        .divider { display: flex; align-items: center; gap: 10px; margin: 18px 0; color: #777; font-size: 0.8rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #ddd; }
        .btn-social { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 1px solid #ccc; border-radius: 6px; background: #fff; padding: 8px; font-size: 0.85rem; cursor: pointer; margin-bottom: 8px; color: #333; font-weight: 500; }
        .btn-social:hover { background: #f7f7f7; border-color: #999; }
        .demo-hint { background: #fffbee; border: 1px solid #ffe082; border-radius: 6px; padding: 10px 14px; font-size: 0.8rem; color: #555; margin-bottom: 16px; }
        .auth-footer { border-top: 1px solid #eee; margin-top: 18px; padding-top: 14px; text-align: center; font-size: 0.82rem; color: #555; }
        .auth-footer a { color: var(--amazon-link); text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }
        .page-footer { text-align: center; font-size: 0.75rem; color: #888; padding: 20px; }
        .page-footer a { color: #555; text-decoration: none; margin: 0 8px; }
        .page-footer a:hover { text-decoration: underline; }
        .forgot-link { font-size: 0.8rem; color: var(--amazon-link); text-decoration: none; }
        .forgot-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<header class="header-top">
    <a href="../index.html" class="logo-brand">merkato<span class="dot">.</span>com</a>
</header>

<div class="auth-card">
    <h4>Sign in</h4>

    <div class="demo-hint">
        <i class="bi bi-info-circle me-1"></i>
        Demo credentials: <strong>demo@shopmart.com</strong> / <strong>demo123</strong>
    </div>

    <!-- Error placeholder -->
    <div id="loginError"></div>

    <form id="loginForm" novalidate>
        <div class="mb-3">
            <label class="form-label" for="loginEmail">Email or mobile phone number</label>
            <input type="email" class="form-control" id="loginEmail" autocomplete="email" required>
        </div>
        <div class="mb-1">
            <label class="form-label" for="loginPassword">Password</label>
            <input type="password" class="form-control" id="loginPassword" autocomplete="current-password" required>
        </div>
        <div class="text-end mb-3">
            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="keepSignedIn">
            <label class="form-check-label" style="font-size:0.82rem;" for="keepSignedIn">Keep me signed in</label>
        </div>
        <button type="submit" class="btn-signin">Sign in</button>
    </form>

    <div class="divider">or sign in with</div>

    <button class="btn-social"><i class="bi bi-google" style="color:#EA4335;"></i> Continue with Google</button>
    <button class="btn-social"><i class="bi bi-facebook" style="color:#1877F2;"></i> Continue with Facebook</button>
    <button class="btn-social"><i class="bi bi-github"></i> Continue with GitHub</button>
    <button class="btn-social"><i class="bi bi-microsoft" style="color:#00A4EF;"></i> Continue with Microsoft</button>

    <div class="auth-footer">
        New to Merkato?<br>
        <a href="signup.html">Create your Merkato account</a>
    </div>
</div>

<div class="page-footer">
    <a href="#">Conditions of Use</a>
    <a href="#">Privacy Notice</a>
    <a href="#">Help</a>
    <p class="mt-2 mb-0">© 2024 ShopMart. All rights reserved.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/auth.js"></script>
</body>
</html>
