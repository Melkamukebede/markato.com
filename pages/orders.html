<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merkato - Your Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --amazon-dark: #131921;
            --amazon-mid: #232f3e;
            --amazon-orange: #febd69;
            --amazon-red: #b12704;
            --amazon-link: #007185;
        }
        body { background: #f3f3f3; font-family: 'Amazon Ember', Arial, sans-serif; }
        .header-top { background: var(--amazon-dark); padding: 10px 0; }
        .logo-brand { color: #fff; font-size: 1.5rem; font-weight: 800; text-decoration: none; letter-spacing: -1px; }
        .logo-brand .dot { color: var(--amazon-orange); }
        .page-hero {
            background: var(--amazon-mid);
            color: #fff;
            padding: 24px 0;
            border-bottom: 3px solid var(--amazon-orange);
        }
        .page-hero h2 { font-size: 1.4rem; font-weight: 700; margin: 0; }
        .page-hero p { color: #aaa; margin: 4px 0 0; font-size: 0.85rem; }
        .order-card {
            background: #fff;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .order-header {
            background: #f7f7f7;
            border-bottom: 1px solid #ddd;
            padding: 12px 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
        }
        .order-meta span { display: block; font-size: 0.72rem; color: #666; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
        .order-meta strong { font-size: 0.9rem; color: #111; }
        .order-id-link { color: var(--amazon-link); font-weight: 600; font-size: 0.85rem; text-decoration: none; }
        .order-id-link:hover { text-decoration: underline; }
        .order-body { padding: 16px 18px; }
        .order-item { display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; align-items: flex-start; }
        .order-item:last-child { border-bottom: none; }
        .order-item img { width: 65px; height: 65px; object-fit: contain; border-radius: 5px; background: #f9f9f9; padding: 4px; flex-shrink: 0; border: 1px solid #eee; }
        .order-item .item-info { flex: 1; }
        .order-item .item-name { font-size: 0.88rem; font-weight: 600; color: var(--amazon-link); margin-bottom: 3px; }
        .order-item .item-qty { font-size: 0.78rem; color: #666; }
        .order-item .item-price { font-size: 0.9rem; font-weight: 700; color: var(--amazon-red); white-space: nowrap; }
        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-delivered { background: #d4edda; color: #155724; }
        .status-shipped { background: #cce5ff; color: #004085; }
        .status-processing { background: #fff3cd; color: #856404; }
        .status-cancelled { background: #f8d7da; color: #721c24; }
        .order-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-order-action { font-size: 0.8rem; border-radius: 20px; padding: 5px 14px; border: 1px solid #ccc; background: #fff; cursor: pointer; color: #333; }
        .btn-order-action:hover { background: #f0f0f0; border-color: #aaa; }
        .btn-track { background: var(--amazon-orange); border-color: var(--amazon-orange); color: #111; font-weight: 700; }
        .btn-track:hover { background: #f3a847; border-color: #f3a847; }
        .empty-orders { text-align: center; padding: 60px 20px; background: #fff; border-radius: 8px; border: 1px solid #ddd; }
        .empty-orders i { font-size: 4rem; color: #ccc; }
        .empty-orders h4 { color: #555; margin-top: 16px; }
        .empty-orders p { color: #888; }
        .filter-bar { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 14px 18px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .filter-bar label { font-size: 0.85rem; font-weight: 600; color: #333; margin-right: 4px; }
        .filter-bar select { font-size: 0.85rem; border-radius: 6px; border: 1px solid #ccc; padding: 4px 10px; }
        footer { background: var(--amazon-dark); color: #aaa; text-align: center; padding: 20px; font-size: 0.8rem; margin-top: 40px; }
        footer a { color: #ccc; text-decoration: none; margin: 0 8px; }
        footer a:hover { text-decoration: underline; }
        .signout-btn { background: none; border: 1px solid #555; color: #fff; border-radius: 6px; padding: 5px 14px; font-size: 0.8rem; cursor: pointer; }
        .signout-btn:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>

<header class="header-top">
    <div class="container d-flex align-items-center justify-content-between">
        <a href="../index.html" class="logo-brand">merkato<span class="dot">.</span>com</a>
        <div class="d-flex gap-3 align-items-center">
            <a href="account.html" style="color:#ccc; font-size:0.85rem; text-decoration:none;">
                <i class="bi bi-person me-1"></i>My Account
            </a>
            <a href="../index.html" style="color:#ccc; font-size:0.85rem; text-decoration:none;">
                <i class="bi bi-house me-1"></i>Home
            </a>
            <button class="signout-btn" id="signOutBtn">
                <i class="bi bi-box-arrow-right me-1"></i>Sign Out
            </button>
        </div>
    </div>
</header>

<div class="page-hero">
    <div class="container">
        <h2><i class="bi bi-bag-check me-2"></i>Your Orders</h2>
        <p id="ordersSubtitle">Loading...</p>
    </div>
</div>

<div class="container py-4">

    <div class="filter-bar">
        <label><i class="bi bi-funnel me-1"></i>Filter by:</label>
        <select id="statusFilter" onchange="renderOrders()">
            <option value="all">All Orders</option>
            <option value="Delivered">Delivered</option>
            <option value="Shipped">Shipped</option>
            <option value="Processing">Processing</option>
            <option value="Cancelled">Cancelled</option>
        </select>
        <label class="ms-3">Sort:</label>
        <select id="sortOrder" onchange="renderOrders()">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
        </select>
    </div>

    <div id="ordersContainer">
        <!-- Rendered by JS -->
    </div>
</div>

<footer>
    <a href="../index.html">Home</a>
    <a href="account.html">Account</a>
    <a href="#">Privacy</a>
    <a href="#">Help</a>
    <p class="mt-2 mb-0">© 2024 Merkato.com</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Redirect if not logged in
    const user = JSON.parse(localStorage.getItem('shopmart_user') || 'null');
    if (!user) { window.location.href = 'login.html'; }

    document.getElementById('ordersSubtitle').textContent =
        user ? `Showing orders for ${user.email}` : '';

    // Sign out
    document.getElementById('signOutBtn').addEventListener('click', () => {
        localStorage.removeItem('shopmart_user');
        window.location.href = '../index.html';
    });

    // Sample orders — replace with real data from localStorage or API
    function getSampleOrders() {
        // Try to build from cart history stored in localStorage
        const saved = JSON.parse(localStorage.getItem('shopmart_orders') || '[]');
        if (saved.length > 0) return saved;

        // Fallback demo orders so the page isn't empty
        return [
            {
                id: 'ORK-2024-00192',
                date: '2024-06-10',
                status: 'Delivered',
                total: 149.99,
                items: [
                    { name: 'Wireless Noise Cancelling Headphones', qty: 1, price: 89.99, img: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=80&q=70' },
                    { name: 'USB-C Fast Charger 65W', qty: 2, price: 30.00, img: 'https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=80&q=70' },
                ]
            },
            {
                id: 'ORK-2024-00145',
                date: '2024-05-22',
                status: 'Delivered',
                total: 34.99,
                items: [
                    { name: 'Clean Code: A Handbook', qty: 1, price: 34.99, img: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=80&q=70' }
                ]
            },
            {
                id: 'ORK-2024-00311',
                date: '2024-07-01',
                status: 'Processing',
                total: 229.00,
                items: [
                    { name: 'Mechanical Keyboard RGB Backlit', qty: 1, price: 229.00, img: 'https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=80&q=70' }
                ]
            }
        ];
    }

    const statusClasses = {
        'Delivered': 'status-delivered',
        'Shipped': 'status-shipped',
        'Processing': 'status-processing',
        'Cancelled': 'status-cancelled'
    };

    function renderOrders() {
        let orders = getSampleOrders();
        const statusFilter = document.getElementById('statusFilter').value;
        const sortOrder = document.getElementById('sortOrder').value;

        if (statusFilter !== 'all') {
            orders = orders.filter(o => o.status === statusFilter);
        }
        orders.sort((a, b) => {
            const da = new Date(a.date), db = new Date(b.date);
            return sortOrder === 'newest' ? db - da : da - db;
        });

        const container = document.getElementById('ordersContainer');
        if (orders.length === 0) {
            container.innerHTML = `
                <div class="empty-orders">
                    <i class="bi bi-bag-x"></i>
                    <h4>No orders found</h4>
                    <p>Try changing the filter, or <a href="../index.html" style="color:var(--amazon-link)">start shopping</a>!</p>
                </div>`;
            return;
        }

        container.innerHTML = orders.map(order => `
            <div class="order-card">
                <div class="order-header">
                    <div class="d-flex gap-4 flex-wrap">
                        <div class="order-meta">
                            <span>Order Placed</span>
                            <strong>${new Date(order.date).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' })}</strong>
                        </div>
                        <div class="order-meta">
                            <span>Total</span>
                            <strong>$${order.total.toFixed(2)}</strong>
                        </div>
                        <div class="order-meta">
                            <span>Status</span>
                            <span class="status-badge ${statusClasses[order.status] || ''}">${order.status}</span>
                        </div>
                    </div>
                    <div class="order-meta text-end">
                        <span>Order #</span>
                        <a href="#" class="order-id-link">${order.id}</a>
                    </div>
                </div>
                <div class="order-body">
                    ${order.items.map(item => `
                        <div class="order-item">
                            <img src="${item.img}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/65x65?text=IMG'">
                            <div class="item-info">
                                <div class="item-name">${item.name}</div>
                                <div class="item-qty">Qty: ${item.qty}</div>
                            </div>
                            <div class="item-price">$${item.price.toFixed(2)}</div>
                        </div>
                    `).join('')}
                    <div class="order-actions">
                        ${order.status === 'Delivered' ? `<button class="btn-order-action btn-track"><i class="bi bi-arrow-repeat me-1"></i>Buy Again</button>` : `<button class="btn-order-action btn-track"><i class="bi bi-geo-alt me-1"></i>Track Package</button>`}
                        <button class="btn-order-action"><i class="bi bi-receipt me-1"></i>View Invoice</button>
                        ${order.status === 'Delivered' ? `<button class="btn-order-action"><i class="bi bi-arrow-counterclockwise me-1"></i>Return/Refund</button>` : ''}
                        ${order.status === 'Processing' ? `<button class="btn-order-action" style="color:#b12704;border-color:#b12704;"><i class="bi bi-x-circle me-1"></i>Cancel Order</button>` : ''}
                    </div>
                </div>
            </div>
        `).join('');
    }

    renderOrders();
</script>
</body>
</html>
